<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Judge</title>
  <link rel="icon" href="icons/icon-48.png">
  <script src="lib/theme-mode.js"></script>
  <!-- The web app: the side panel and the dashboard side by side, the same
       pages the extension shows in its side panel and its dashboard tab. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; background: #f4f5f7; }
    iframe { border: 0; height: 100%; display: block; }
    #panel { width: 420px; flex: none; border-right: 1px solid #d0d4da; background: #fff; }
    #dashboard { flex: 1; min-width: 0; }
    /* The bar between the panes: drag to resize the side panel (lib/splitter.js). */
    #splitter { flex: none; width: 6px; margin: 0 -3px; cursor: col-resize; position: relative; z-index: 2; touch-action: none; }
    #splitter:hover, #splitter:focus-visible, body.resizing #splitter { background: #c96442; outline: none; }
    body.resizing { cursor: col-resize; user-select: none; }
    /* The iframes would swallow the pointer while dragging. */
    body.resizing iframe { pointer-events: none; }
    :root[data-theme="dark"] body { background: #111318; }
    :root[data-theme="dark"] #panel { border-right-color: rgba(255, 255, 255, 0.08); background: #111318; box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5); position: relative; z-index: 1; }
    @media (max-width: 900px) {
      body { flex-direction: column; height: auto; }
      #panel { width: 100% !important; height: 100vh; border-right: 0; border-bottom: 1px solid #d0d4da; }
      #dashboard { height: 100vh; }
      #splitter { display: none; }
    }
  </style>
</head>
<body>
  <iframe id="panel" src="sidebar/sidebar.html" title="LLM Judge side panel"></iframe>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize side panel" tabindex="0"
       title="Drag to resize · double-click to reset"></div>
  <iframe id="dashboard" src="dashboard/dashboard.html" title="LLM Judge dashboard" allow="fullscreen"></iframe>
  <script src="lib/splitter.js"></script>
</body>
</html>
