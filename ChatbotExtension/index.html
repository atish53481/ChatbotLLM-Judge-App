<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Judge</title>
  <link rel="icon" href="icons/icon-48.png">
  <!-- The web app: the side panel and the dashboard side by side, the same
       pages the extension shows in its side panel and its dashboard tab. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; background: #f4f5f7; }
    iframe { border: 0; height: 100%; display: block; }
    #panel { width: 420px; flex: none; border-right: 1px solid #d0d4da; background: #fff; }
    #dashboard { flex: 1; min-width: 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #15171a; }
      #panel { border-right-color: #33373d; background: #1d1f23; }
    }
    @media (max-width: 900px) {
      body { flex-direction: column; height: auto; }
      #panel { width: 100%; height: 100vh; border-right: 0; border-bottom: 1px solid #d0d4da; }
      #dashboard { height: 100vh; }
    }
  </style>
</head>
<body>
  <iframe id="panel" src="sidebar/sidebar.html" title="LLM Judge side panel"></iframe>
  <iframe id="dashboard" src="dashboard/dashboard.html" title="LLM Judge dashboard"></iframe>
</body>
</html>
